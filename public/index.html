<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <h1>Library Management System</h1>

    <form id="issueBookForm">
        <label for="bookName">Book Name:</label>
        <input type="text" id="bookName" name="bookName" required>
        <button type="submit">Issue Book</button>
    </form>

    <h2>Issued Books</h2>
    <div id="issuedBooksContainer" class="card-container">
    </div>

    <h2>Returned Books</h2>
    <div id="returnedBooksContainer" class="card-container">
    </div>

    <div id="payFineModal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close">&times;</span>
            <p id="fineAmount">Fine amount: ₹0</p>
            <button id="payFineButton">Pay Fine</button>
        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
